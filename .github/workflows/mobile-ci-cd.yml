name: mobile-ci-cd

on:
  pull_request:
  push:
    branches: [main, staging]
    tags:
      - 'v*.*.*'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Static analyze
        run: flutter analyze

      - name: Unit/widget tests
        run: flutter test --coverage

  android-build:
    runs-on: ubuntu-latest
    needs: flutter-quality
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode Android keystore
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/upload-keystore.jks

      - name: Generate key.properties
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          cat > android/key.properties <<KEYS
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          KEYS

      - name: Validate env config
        run: ./scripts/deploy/verify_env.sh ${{ github.ref_name == 'main' && 'production' || 'staging' }}

      - name: Install deps
        run: flutter pub get

      - name: Build AAB
        run: |
          flutter build appbundle \
            --release \
            --dart-define-from-file=config/env/${{ github.ref_name == 'main' && 'production' || 'staging' }}.json

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/*.aab

  firebase-functions-deploy:
    runs-on: ubuntu-latest
    needs: flutter-quality
    if: github.event_name != 'pull_request'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate service account
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> $GITHUB_ENV

      - name: Validate env config
        run: ./scripts/deploy/verify_env.sh ${{ github.ref_name == 'main' && 'production' || 'staging' }}

      - name: Deploy functions
        run: ./scripts/deploy/deploy_functions.sh ${{ github.ref_name == 'main' && 'production' || 'staging' }}

  play-store-release:
    runs-on: ubuntu-latest
    needs: [android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: build/artifacts

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ailearn.app
          releaseFiles: build/artifacts/*.aab
          track: internal
          status: completed
