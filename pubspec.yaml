name: ai_learn
description: TikTok-style knowledge learning app skeleton.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.1.2
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  firebase_messaging: ^15.0.4
  firebase_dynamic_links: ^6.0.8
  firebase_crashlytics: ^4.1.2
  firebase_performance: ^0.10.0+6
  google_mobile_ads: ^5.1.0
  just_audio: ^0.9.39
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
